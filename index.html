<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Дело № 127</title></head><body>
<title>Дело № 127</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=PT+Mono&family=Onest:wght@400;500;600;700&family=Caveat:wght@600;700&family=PT+Serif:ital,wght@1,700&display=swap">
<style>
/* Layout: нуар-детектив — тёмная доска следователя с карточками улик на красной нити слева, бумажное «дело» с заданием справа. Единый тёмный мир. */
:root{
  --night:#14161B; --board:#1F2127; --board-2:#262931; --line:#353943; --dim:#8C877C; --chalk:#E9E4D8;
  --paper:#EDE6D6; --paper-2:#F7F2E7; --paper-edge:#D9CEB6; --ink:#25211B; --ink-2:#6E6556;
  --red:#C3322A; --red-hot:#E2483C; --gold:#E3B95B; --kraft:#B8A27A; --sticky:#EFD35C;
  --ok:#2E7D4F; --ok-soft:#DCEBDD; --bad:#B3261E; --bad-soft:#F3D9D3;
  --p1:#4A90D9; --p2:#E3B95B; --p3:#3FA38A; --p4:#9B6BD3; --p5:#E0703A; --p6:#D04F8E;
  --f-head:"Oswald", "Arial Narrow", Impact, sans-serif;
  --f-type:"PT Mono", "Courier New", ui-monospace, monospace;
  --f-body:"Onest", Inter, "Segoe UI", system-ui, sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--night);color:var(--chalk);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(900px 500px at 15% -10%,rgba(227,185,91,.07),transparent 60%),radial-gradient(700px 500px at 110% 30%,rgba(195,50,42,.08),transparent 60%)}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:22px 56px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:6px}
.type{font-family:var(--f-type);letter-spacing:.06em}
.tl{font-family:var(--f-type);font-size:12px;letter-spacing:.14em;text-transform:uppercase}

.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px;color:var(--dim)}
.top b{font-weight:400;user-select:none;cursor:default}
.top b i{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--red);margin-right:8px}
.top .ev{color:var(--chalk)}
.testbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border:1px dashed var(--gold);color:var(--gold);border-radius:10px;padding:9px 14px;font-size:13px;margin-bottom:14px}
.link{background:none;border:0;color:inherit;padding:2px 0;font-size:13px;text-decoration:underline;text-underline-offset:3px;opacity:.85}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:8px;padding:13px 20px;font-family:var(--f-head);font-weight:600;font-size:17px;letter-spacing:.04em;text-transform:uppercase;background:var(--red);color:#fff;transition:transform .15s, background .15s;text-align:center}
.btn:hover{transform:translateY(-1px);background:var(--red-hot)}
.btn:disabled{opacity:.35;cursor:not-allowed;transform:none}
.btn.dark{background:var(--ink);color:var(--paper)}
.btn.dark:hover{background:#3A342B}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.btn.wide{width:100%}

/* ---------- INTRO ---------- */
.intro{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:28px;align-items:start;margin-top:10px}
.file{position:relative;background:var(--paper);color:var(--ink);border-radius:4px 10px 10px 10px;padding:34px clamp(22px,4vw,44px) 30px;transform:rotate(-.8deg);box-shadow:0 30px 60px rgba(0,0,0,.5);margin-top:18px}
.file::before{content:"";position:absolute;top:-18px;left:0;width:170px;height:24px;background:var(--paper-edge);border-radius:8px 8px 0 0}
.file .tab{position:absolute;top:-15px;left:16px;font-family:var(--f-type);font-size:11px;letter-spacing:.14em;color:var(--ink-2)}
.stamp{display:inline-block;border:3px solid var(--red);color:var(--red);font-family:var(--f-head);font-weight:700;letter-spacing:.14em;padding:3px 12px;font-size:15px;transform:rotate(7deg);border-radius:4px;opacity:.9}
.file .stamp{position:absolute;right:28px;top:28px}
.file h1{font-family:var(--f-head);font-weight:700;font-size:clamp(52px,8vw,84px);line-height:.95;letter-spacing:-.01em;margin:10px 0 18px;text-transform:uppercase}
.dossier{display:grid;grid-template-columns:120px 1fr;gap:6px 14px;margin:0 0 18px;font-size:16px}
.dossier dt{font-family:var(--f-type);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);padding-top:3px}
.dossier dd{margin:0;font-weight:600}
.file p{margin:0 0 14px;font-size:17px;line-height:1.55}
.file .who{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-top:22px;padding-top:18px;border-top:1.5px dashed var(--paper-edge)}
.file label{display:block;width:100%;font-family:var(--f-type);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}
.file input{flex:1 1 220px;min-width:0;font:inherit;font-size:18px;font-weight:600;padding:10px 2px;border:0;border-bottom:2px solid var(--ink);background:transparent;color:var(--ink);border-radius:0}
.file input:focus{outline:none;border-color:var(--red)}
.file input::placeholder{color:#A99F8C;font-weight:400}
.note{background:var(--sticky);color:#2B2410;padding:26px 24px;transform:rotate(1.4deg);box-shadow:0 20px 40px rgba(0,0,0,.45);border-radius:2px;position:relative;margin-top:28px}
.note::before{content:"";position:absolute;top:-10px;left:50%;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:var(--red);box-shadow:0 3px 6px rgba(0,0,0,.4)}
.note h2{font-family:var(--f-head);font-size:24px;text-transform:uppercase;letter-spacing:.02em;margin:0 0 12px}
.note ol{margin:0;padding:0;list-style:none;display:grid;gap:10px;counter-reset:n}
.note li{counter-increment:n;display:grid;grid-template-columns:28px 1fr;gap:8px;font-size:15px;line-height:1.4}
.note li::before{content:counter(n);font-family:var(--f-head);font-weight:700;font-size:20px;line-height:1}
.chapters{margin-top:22px;display:grid;gap:6px}
.chapters div{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;font-size:14px;color:var(--chalk)}
.chapters i{width:12px;height:12px;border-radius:50%;background:var(--pc)}
.chapters span{color:var(--dim)}

/* ---------- GAME ---------- */
.game{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:22px;align-items:stretch}
.boardbox{background:var(--board);border-radius:18px;padding:16px;box-shadow:inset 0 0 0 1px var(--line), 0 20px 50px rgba(0,0,0,.35);
  background-image:radial-gradient(rgba(255,255,255,.035) 1px,transparent 1.2px);background-size:7px 7px}
.bhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:0 4px 6px}
.bhead h2{font-family:var(--f-head);font-weight:700;font-size:26px;letter-spacing:.02em;text-transform:uppercase;margin:0}
.bhead span{color:var(--dim)}
.board{position:relative;aspect-ratio:6/5;width:100%;max-height:calc(100vh - 235px);min-height:380px}
.board svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.cells{position:absolute;inset:0;display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(5,1fr)}
.cell{margin:0;height:86%;aspect-ratio:1;max-width:92%;justify-self:center;align-self:center;border:0;padding:0;position:relative;display:grid;place-items:center;background:var(--paper);color:var(--ink);border-radius:3px;transform:rotate(var(--rot));box-shadow:0 4px 10px rgba(0,0,0,.45);font-family:var(--f-head);font-weight:700;font-size:clamp(13px,1.7vw,22px);cursor:default;transition:transform .25s, box-shadow .25s}
.cell::before{content:"";position:absolute;top:-5px;left:50%;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:var(--pc);box-shadow:0 2px 3px rgba(0,0,0,.5);z-index:1}
.cell .no{position:absolute;left:8%;bottom:4%;font-family:var(--f-type);font-weight:400;font-size:clamp(7px,.75vw,10px);color:var(--ink-2)}
.cell .lb{position:absolute;top:10%;left:0;right:0;text-align:center;font-family:var(--f-type);font-weight:400;font-size:clamp(5px,.6vw,8px);letter-spacing:.06em}
.cell.passed{background:#D9D0BC;color:#9A907E}
.cell.passed::after{content:"✓";position:absolute;inset:16%;display:grid;place-items:center;border:2px solid var(--red);border-radius:50%;color:var(--red);font-size:clamp(11px,1.3vw,18px);transform:rotate(-12deg);opacity:.85}
.cell.passed > *{opacity:.35}
.cell.trap{background:#2E3138;color:var(--red-hot);box-shadow:inset 0 0 0 1.5px var(--red), 0 4px 10px rgba(0,0,0,.45)}
.cell.trap .lb{color:var(--red-hot)}
.cell.bonus{background:var(--sticky);color:#3A2F0B}
.selfcheck{display:grid;gap:4px;text-align:center;margin:6px 0 2px;font-size:14px;color:var(--ink-2)}.selfcheck b{font-family:Oswald,'Arial Narrow',sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--ink)}
.cell.start,.cell.finish{background:var(--red);color:#fff;font-size:clamp(9px,1vw,13px);letter-spacing:.08em}
.cell.cur{transform:rotate(0) scale(1.14);box-shadow:0 0 0 3px var(--gold), 0 10px 24px rgba(0,0,0,.6);z-index:2}
.test .cell{cursor:pointer}
.lens{position:absolute;height:calc(100% / 5 * .5);aspect-ratio:1;transform:translate(-50%,-50%);transition:left .32s ease, top .32s ease;z-index:4;pointer-events:none}
.lens svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 6px 10px rgba(0,0,0,.6))}
.evstrip{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;margin:0 0 16px}
.evstrip > div{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:center;padding:7px 10px;border-radius:8px;background:var(--board-2);font-size:12px;line-height:1.25;color:var(--dim);min-width:0}
.evstrip i{width:10px;height:10px;border-radius:50%;background:var(--pc)}
.evstrip b{display:block;color:var(--chalk);font-weight:600;white-space:nowrap}
.evstrip span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.evstrip .now{box-shadow:inset 0 0 0 1.5px var(--gold)}
.evstrip .got{background:#2D2A22}
.evstrip .got b::after{content:" ✓";color:var(--gold)}
.minibar{display:none}
.goal{margin:0 0 16px;padding:14px 16px;border-radius:6px;background:var(--paper-2);border:1.5px solid var(--pc);position:relative}
.goal .tl{color:var(--ink-2);font-size:11px}
.goal p{margin:4px 0 0;font-size:15px;line-height:1.45;font-weight:500}
.milestone{margin:0 0 16px;padding:16px 18px;border-radius:6px;background:var(--ink);color:var(--paper);position:relative;overflow:hidden}
.milestone .tl{color:var(--gold);font-size:11px}
.milestone h3{font-family:var(--f-head);font-size:24px;text-transform:uppercase;margin:4px 0 4px;letter-spacing:.02em;line-height:1.1}
.milestone p{margin:0;font-size:15px;color:#D8D1C2}
.milestone .seal{position:absolute;right:14px;top:12px;border:2.5px solid var(--gold);color:var(--gold);border-radius:50%;width:54px;height:54px;display:grid;place-items:center;font-family:var(--f-head);font-weight:700;font-size:13px;transform:rotate(-12deg);opacity:.9}
.cert{width:100%;border-radius:4px;box-shadow:0 10px 26px rgba(0,0,0,.25);display:block}
.rankline{display:flex;align-items:center;gap:12px;justify-content:center;flex-wrap:wrap;margin:6px 0 0}
.rankline b{font-family:var(--f-head);font-size:22px;text-transform:uppercase;color:var(--red);letter-spacing:.03em}
.ranks{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;width:100%;margin-top:6px}
.ranks div{border:1.5px solid var(--paper-edge);border-radius:6px;padding:7px 4px;font-size:12px;line-height:1.25;color:var(--ink-2);background:var(--paper-2)}
.ranks div b{display:block;font-family:var(--f-head);font-size:14px;text-transform:uppercase;color:var(--ink-2)}
.ranks .on{border-color:var(--red);background:#F6E3DC}
.ranks .on b{color:var(--red)}
.newrank{background:var(--sticky);color:#2B2410;border-radius:6px;padding:10px 14px;font-weight:600;width:100%}
.panel{background:var(--paper);color:var(--ink);border-radius:4px 12px 12px 12px;position:relative;min-width:0;min-height:420px;box-shadow:0 24px 50px rgba(0,0,0,.45)}
.panel .pin{position:absolute;inset:0;overflow:auto;padding:clamp(20px,3vw,30px)}
.portrait{width:150px;height:auto;flex:none;transform:rotate(3deg);box-shadow:0 8px 18px rgba(0,0,0,.3);border-radius:3px}
.dossierbox{display:flex;gap:18px;align-items:flex-start;margin:4px 0 14px}
.dossierbox .dossier{grid-template-columns:110px 1fr;font-size:14px;margin:0}
.file .portrait{position:absolute;right:36px;top:92px;width:170px;transform:rotate(4deg)}
.panel::before{content:"";position:absolute;top:-14px;left:0;width:150px;height:18px;background:var(--paper-edge);border-radius:8px 8px 0 0}
.ph{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:16px;padding-bottom:12px;border-bottom:1.5px dashed var(--paper-edge)}
.ph .ch{display:flex;flex-direction:column;gap:2px}
.ph .ch small{font-family:var(--f-type);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}
.ph .ch b{font-family:var(--f-head);font-size:22px;font-weight:700;text-transform:uppercase;letter-spacing:.02em;line-height:1.1;display:flex;gap:8px;align-items:center}
.ph .ch b i{width:10px;height:10px;border-radius:50%;background:var(--pc);flex:none}
.ph .acc{font-family:var(--f-type);font-size:12px;color:var(--ink-2);text-align:right;white-space:nowrap}
.toast{border-left:4px solid var(--red);background:var(--paper-2);padding:10px 14px;margin-bottom:16px;font-weight:600;font-size:15px}
.testimony{margin:0 0 14px;padding:12px 16px;background:var(--paper-2);border-left:3px solid var(--ink);font-size:16px}
.testimony small{display:block;font-family:var(--f-type);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);margin-bottom:3px}
.q{font-weight:700;font-size:19px;line-height:1.35;margin:0 0 14px}
.opts{display:grid;gap:9px}
.opt{text-align:left;background:var(--paper-2);border:1.5px solid var(--paper-edge);border-radius:6px;padding:12px 14px;display:grid;grid-template-columns:26px 1fr;gap:12px;align-items:start;font-size:15px;line-height:1.45;color:var(--ink);transition:border-color .15s, transform .15s}
.opt:hover:not(:disabled){border-color:var(--ink);transform:translateX(2px)}
.opt .k{font-family:var(--f-head);font-weight:700;font-size:18px;line-height:1.2;color:var(--ink-2)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .k{color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{color:var(--bad)}
.opt.dim{opacity:.45}
.opt .fb{display:block;font-size:14px;margin-top:5px;color:var(--ink-2)}
.verdict{margin-top:14px;padding:12px 16px;font-family:var(--f-head);font-size:19px;font-weight:600;letter-spacing:.02em;text-transform:uppercase;border:2.5px solid;border-radius:6px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.verdict.ok{color:var(--ok);border-color:var(--ok)}
.verdict.no{color:var(--bad);border-color:var(--bad)}
.verdict span{font-family:var(--f-body);text-transform:none;font-size:14px;font-weight:500;letter-spacing:0;color:var(--ink)}
.verdict-body{font-size:14px;margin-top:8px;color:var(--ink)}
.pool,.answer{display:flex;flex-wrap:wrap;gap:8px}
.pool{min-height:44px;margin-bottom:12px}
.tok{border:1.5px solid var(--ink);background:var(--paper-2);border-radius:6px;padding:9px 12px;text-align:left;font-weight:500;font-size:15px;color:var(--ink)}
.tok:hover:not(:disabled){background:#fff}
.answer{flex-direction:column;flex-wrap:nowrap;counter-reset:a;min-height:56px;border:1.5px dashed var(--ink-2);border-radius:8px;padding:10px}
.answer:empty::before{content:"Нажимайте на карточки выше по порядку";color:var(--ink-2);font-size:14px;padding:6px}
.answer .tok{counter-increment:a;display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;width:100%;border-color:var(--paper-edge)}
.answer .tok::before{content:counter(a);font-family:var(--f-head);font-weight:700;color:var(--red)}
.answer .tok .x{color:var(--ink-2);font-size:13px}
.answer .tok.right{border-color:var(--ok);background:var(--ok-soft)}
.answer .tok.wrong{border-color:var(--bad);background:var(--bad-soft)}
.correct-order{margin:8px 0 0;padding-left:22px;font-size:14px}
.srt{display:grid;gap:8px}
.srow{display:grid;gap:8px;border:1.5px solid var(--paper-edge);background:var(--paper-2);border-radius:6px;padding:10px 12px;font-size:15px}
.srow.right{border-color:var(--ok);background:var(--ok-soft)}
.srow.wrong{border-color:var(--bad);background:var(--bad-soft)}
.srow .fix{display:block;font-size:13px;color:var(--bad);margin-top:2px}
.seg{display:flex;gap:4px;flex-wrap:wrap;justify-self:start}
.seg button{border:1.5px solid var(--paper-edge);background:var(--paper);border-radius:6px;padding:5px 11px;font-size:13px;font-weight:600;color:var(--ink-2)}
.seg button.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.seg button:disabled{cursor:default}
.act{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:16px;flex-wrap:wrap}
.act .link{color:var(--ink-2)}

.event{margin:0 0 16px;padding:18px;border-radius:6px;position:relative}
.event.trap{background:#2E3138;color:var(--chalk)}
.event.bonus{background:var(--sticky);color:#2B2410}
.event .tl{opacity:.8}
.event h3{font-family:var(--f-head);font-size:24px;text-transform:uppercase;margin:4px 0 6px;letter-spacing:.02em;line-height:1.1}
.event p{margin:0;font-size:15px}
.event .rule{display:block;margin-top:10px;font-family:var(--f-type);font-size:12px;letter-spacing:.06em;opacity:.85}
.event.trap .rule{color:#F09A92}

.res{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.res .big{font-family:var(--f-head);font-size:76px;font-weight:700;line-height:1}
.res .big.no{color:var(--bad)}
.res h2{font-family:var(--f-head);text-transform:uppercase;font-size:26px;margin:0}
.res p{color:var(--ink-2);margin:0}
.closed{position:relative;padding:10px 0 4px;width:100%;text-align:left}
.closed .stamp{font-size:22px;padding:5px 12px;position:absolute;right:0;top:-4px;transform:rotate(-9deg)}
.closed .tl{color:var(--ink-2)}
.closed .nm{font-family:var(--f-head);font-weight:700;font-size:38px;text-transform:uppercase;line-height:1.05;margin:22px 0 8px}
.closed p{font-size:16px;color:var(--ink)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;margin-top:14px}
.kpis div{border:1.5px solid var(--paper-edge);background:var(--paper-2);border-radius:6px;padding:10px}
.kpis b{display:block;font-family:var(--f-head);font-size:24px;font-weight:700;overflow-wrap:anywhere}
.kpis span{font-family:var(--f-type);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}

.cell.lock{background:#3D4B5E;color:#E9E4D8}
.cell.lock .lb{color:#B9C6D8}
.cell.fact{background:#D5DEE8;color:#22324A}
.cell.gate{background:#7E1F1A;color:#F3D9C9;border-radius:50%;box-shadow:inset 0 0 0 3px #A82B23, 0 4px 10px rgba(0,0,0,.5)}
.cell.gate::before{display:none}
.cell.lock span:not(.lb):not(.no),.cell.fact span:not(.lb):not(.no),.cell.gate span:not(.lb):not(.no){font-size:clamp(8px,.95vw,13px);letter-spacing:.06em}
.event.lockcard{background:#3D4B5E;color:#E9E4D8}
.event.gatecard{background:#7E1F1A;color:#F6E6DC}
.event.factcard{background:#D5DEE8;color:#22324A}
.codeform{display:grid;gap:8px;margin-top:4px}
.codeform label{font-family:var(--f-type);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}
.codeform .row{display:flex;gap:8px;flex-wrap:wrap}
.codeform input{flex:1 1 180px;min-width:0;font:inherit;font-size:18px;font-weight:600;letter-spacing:.04em;padding:11px 14px;border:1.5px solid var(--ink);border-radius:6px;background:var(--paper-2);color:var(--ink)}
.codeform input:focus{outline:none;border-color:var(--red)}
.formerr{color:var(--bad);font-size:14px;font-weight:600}
.testhint{font-family:var(--f-type);font-size:12px;color:#8A6D1E;background:#F4E7B8;border-radius:4px;padding:6px 10px;margin-top:8px}
.dayhead{margin:10px 0 2px;color:var(--gold)}
.chapters .dayhead:first-child{margin-top:0}
@media (max-width:940px){
  .game,.intro{grid-template-columns:1fr}
  .panel{min-height:0}
  .panel .pin{position:static;overflow:visible}
  .board{width:100%}
  .minibar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--board);border-radius:12px;padding:10px 14px;box-shadow:inset 0 0 0 1px var(--line)}
  .minibar .mt{flex:1 1 160px;min-width:0;font-size:14px}
  .minibar .mt b{display:block;font-family:var(--f-head);text-transform:uppercase;font-size:16px;letter-spacing:.02em}
  .minibar .bar{height:6px;border-radius:3px;background:var(--line);margin-top:6px;overflow:hidden}
  .minibar .bar i{display:block;height:100%;background:var(--red-hot)}
  .minibar .link{color:var(--gold);font-size:14px}
  .boardbox{display:none}
  .boardbox.open{display:block}
  .evstrip{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (max-width:560px){
  .boardbox{padding:8px}
  .cell .no,.cell .lb{display:none}
  .cell{height:84%}
  .board{min-height:0}
  .evstrip span{display:none}
  .evstrip > div{padding:6px 8px;font-size:12px;gap:6px}
  .evstrip i{width:8px;height:8px}
  .bhead h2{font-size:20px}
  .dossier{grid-template-columns:1fr;gap:0}
  .dossier dd{margin-bottom:8px}
  .file > .tl{padding-right:110px}
  .ranks{grid-template-columns:repeat(2,1fr)}
  .kpis b{font-size:17px;white-space:nowrap;overflow-wrap:normal}
  .kpis span{font-size:10px;letter-spacing:.04em}
  .kpis div{padding:8px 6px}
  .file .portrait{position:static;width:130px;margin:0 0 14px;display:block}
  .dossierbox{flex-direction:column}
  .dossierbox .portrait{width:130px}
  .file .stamp{top:16px;right:16px;font-size:12px}
  .closed .nm{font-size:30px;max-width:100%}
  .closed .stamp{position:static;display:inline-block;margin-bottom:8px}
}
@media (prefers-reduced-motion:reduce){ *{transition:none !important} }

    <div class="dossierbox">${PORTRAIT}
    <dl class="dossier"><dt>Клиент</dt><dd>Иван Петрович, 42 года</dd><dt>Долг</dt><dd>1,4 млн ₽ · 6 кредиторов</dd><dt>Обстоятельства</dt><dd>Звонки коллекторов, арест карты, удержания из зарплаты</dd><dt>Улики</dt><dd>${evidenceGot()} из ${NZ}</dd></dl></div>
    <p>Иван Петрович на грани. Каждый день новые звонки, а половину зарплаты забирают приставы. Ему уже обещали помочь и пропали с деньгами, поэтому он никому не верит.</p>
    <p>Ваша задача — пройти шесть глав расследования, собрать шесть улик и вывести клиента к законному решению.</p>`;
}
function introHtml(){
  return topHtml() + `<div class="intro">
    <form class="file" id="nameform">
      <span class="tab">ЛИЧНОЕ ДЕЛО КЛИЕНТА</span><span class="stamp">СРОЧНО</span>
      <div class="tl" style="color:var(--ink-2)">Отдел расследований «Белого маркера»</div>
      <h1>Дело<br>№ 127</h1>
      ${PORTRAIT}<dl class="dossier"><dt>Клиент</dt><dd>Иван Петрович, 42 года</dd><dt>Долг</dt><dd>1,4 млн ₽ · 6 кредиторов</dd><dt>Обстоятельства</dt><dd>Звонки коллекторов, арест карты, удержания из зарплаты</dd><dt>Улики</dt><dd>0 из 6</dd></dl>
      <p>Иван Петрович на грани. Каждый день новые звонки, а половину зарплаты забирают приставы. Ему уже обещали помочь и пропали с деньгами, поэтому он никому не верит.</p>
      <p>Вам передают его дело. Пройдите шесть глав расследования, соберите шесть улик и закройте дело: выведите клиента к законному решению.</p>
      <div class="who"><label for="nm">Следователь</label><input id="nm" autocomplete="name" placeholder="Ваши имя и фамилия" maxlength="60" value="${esc(S.name)}"><button class="btn" type="submit">Взять дело →</button></div>
    </form>
    <div>
      <div class="note"><h2>Как вести расследование</h2><ol>
        <li>На каждой карточке задание: вопрос, показания клиента, порядок шагов или сортировка.</li>
        <li>Верный ответ — лупа переходит на следующую карточку.</li>
        <li>Ошибка — остаётесь на месте и получаете другое задание.</li>
        <li>Тёмные карточки — «Ложный след»: ответьте верно, и вы его обойдёте, ошибётесь — назад на 2.</li>
        <li>Жёлтые карточки — «Зацепка»: верный ответ даёт +2.</li>
        <li>«Архив» — вопрос о нашей компании. Ответ впишите сами.</li>
        <li>Расследование идёт два дня. В конце первого дня на доске печать: снять её можно кодовым словом, которое вы получите у руководителя расследования.</li>
        <li>После шестой главы дело закрыто: вы получите благодарность со званием. Звание можно повысить в самопроверке.</li>
      </ol></div>
      <div class="chapters">${STAGES.map(s => `${s.id === 1 || s.id === 4 ? `<p class="dayhead tl">День ${s.id === 1 ? 1 : 2}</p>` : ''}<div style="--pc:${PC(s.id)}"><i></i><div>Глава ${s.id}. ${esc(s.chapter)} <span>· ${esc(s.title)}</span></div></div>`).join('')}<div style="--pc:var(--kraft)"><i></i><div>Самопроверка <span>· по желанию, чтобы повысить звание</span></div></div></div>
    </div></div>`;
}
function boardHtml(){
  const pts = CELLS.map((_, i) => center(i).join(' ')).join(' L ');
  const done = CELLS.slice(0, S.pos + 1).map((_, i) => center(i).join(' ')).join(' L ');
  const cells = CELLS.map((c, i) => {
    const { row, col } = rc(i);
    let cls = c.type === 'q' ? 'cq' : c.type, label = '', lb = '';
    if (c.type === 'start') label = 'ДЕЛО';
    else if (c.type === 'finish') label = 'ФИНИШ';
    else if (c.type === 'ev') { const e = EVENTS[c.z]; cls = e.kind; label = (e.kind === 'bonus' ? '+' : '−') + e.n; lb = e.kind === 'bonus' ? 'ЗАЦЕПКА' : 'ЛОЖНЫЙ СЛЕД'; }
    else if (c.type === 'lock') { label = 'КОД'; lb = 'СЕЙФ'; }
    else if (c.type === 'fact') { label = 'ФАКТ'; lb = 'АРХИВ'; }
    else if (c.type === 'gate') { label = 'ДЕНЬ ' + c.day; lb = 'ПЕЧАТЬ'; }
    else label = '?';
    if (i < S.pos) cls += ' passed';
    if (i === S.pos) cls += ' cur';
    return `<button class="cell ${cls}" data-cell="${i}" style="grid-row:${row + 1};grid-column:${col + 1};--rot:${rot(i)}deg;--pc:${PC(c.z)}" tabindex="${TEST ? 0 : -1}" aria-label="Карточка ${i}">${lb ? `<span class="lb">${lb}</span>` : ''}<span>${label}</span><span class="no">${i || ''}</span></button>`;
  }).join('');
  const [cx, cy] = lensAt(S.pos);
  return `<div class="board ${TEST ? 'test' : ''}">
    <svg viewBox="0 0 ${COLS * 100} ${ROWS * 100}" preserveAspectRatio="none" aria-hidden="true"><path d="M ${pts}" fill="none" stroke="#C3322A" stroke-opacity=".45" stroke-width="2" vector-effect="non-scaling-stroke"/>
    ${S.pos > 0 ? `<path d="M ${done}" fill="none" stroke="#E2483C" stroke-width="3.5" vector-effect="non-scaling-stroke"/>` : ''}</svg>
    <div class="cells">${cells}</div>
    <div class="lens" id="lens" style="left:${cx / COLS}%;top:${cy / ROWS}%">${lensSvg((S.name || '').trim().charAt(0).toUpperCase())}</div>
  </div>`;
}
function evidenceHtml(){
  const z = CELLS[S.pos].z;
  return `<div class="evstrip">${STAGES.map(s => { const got = S.pos > zoneRange(s.id)[1] || !!S.done; return `<div class="${got ? 'got' : z === s.id ? 'now' : ''}" style="--pc:${PC(s.id)}"><i></i><div style="min-width:0"><b>Улика ${s.id}</b><span>${esc(s.chapter)}</span></div></div>`; }).join('')}</div>`;
}
function minibarHtml(){
  const z = CELLS[S.pos].z, pct = Math.round(S.pos / LAST * 100);
  return `<div class="minibar"><div class="mt"><span class="tl" style="color:var(--dim)">Карточка ${S.pos} из ${LAST}</span><b>${esc(chapterOf(z))}</b><div class="bar"><i style="width:${pct}%"></i></div></div><button class="link" data-act="board">${boardOpen ? 'Скрыть доску' : 'Показать доску'}</button></div>`;
}
function render(){
  if (!S.started) { $app.innerHTML = introHtml(); return; }
  const z = CELLS[S.pos].z;
  $app.innerHTML = topHtml() + evidenceHtml() + `<div class="game">
      <div>${minibarHtml()}<div class="boardbox ${boardOpen ? 'open' : ''}"><div class="bhead"><span class="tl">Доска улик</span><span class="tl">карточка ${S.pos} / ${LAST}</span></div>${boardHtml()}</div></div>
      <aside class="panel" style="--pc:${PC(z)}"><div class="pin" id="panel">${panelHtml()}</div></aside>
    </div>`;
}
function panelHead(){
  const c = CELLS[S.pos];
  const small = c.type === 'gate' ? `День ${c.day - 1} позади` : c.z === 7 ? 'Финал' : c.z ? `Глава ${c.z} · ${stageOf(c.z)}` : 'Дело № 127';
  const acc = S.tries ? `${S.right} из ${S.tries}<br>верных` : '';
  return `<div class="ph"><div class="ch"><small>${esc(small)}</small><b><i></i>${esc(chapterOf(c.z))}</b></div><div class="acc">${acc}</div></div>`;
}
function panelHtml(){
  const c = CELLS[S.pos];
  let fl = '';
  if (flash && flash.stage) { const a = flash.stage, st = STAGES[a - 1];
    fl = `<div class="milestone"><span class="seal">ОК</span><span class="tl">Глава ${a} закрыта</span><h3>Поздравляю, этап освоен!</h3><p>«${esc(st.title)}» — пройдено. Улика ${a} «${esc(st.chapter)}» в деле.${flash.day ? ' Рабочий день следователя окончен.' : ''}</p></div>`; }
  else if (flash) fl = `<div class="toast">${esc(flash)}</div>`;
  flash = null;
  if (S.done) return closedHtml();
  if (showDossier && c.type !== 'start') return dossierHtml() + `<div class="act"><span></span><button class="btn" data-act="dossier">Вернуться к заданию →</button></div>`;
  if (c.type === 'start') return fl + `<p class="q">Дело у вас в руках, следователь ${esc(S.name)}.</p><p>Первая глава — «План расследования». Без подготовки к клиенту не выходят.</p><div class="act"><span></span><button class="btn" data-act="go1">Начать →</button></div>` + `<div style="border-top:1.5px dashed var(--paper-edge);margin-top:18px;padding-top:16px">` + dossierHtml() + `</div>`;
  if (c.type === 'finish') return finishHtml();
  if (c.type === 'gate') return gateHtml(c, fl);
  if (c.type === 'fact') return factHtml(c, fl);
  if (c.type === 'lock' && !S.open[S.pos]) return lockHtml(c, fl);
  if (c.type === 'ev') {
    const e = EVENTS[c.z];
    const head = `<div class="event ${e.kind}"><span class="tl">${e.kind === 'bonus' ? 'Зацепка' : 'Ложный след'}</span><h3>${esc(e.t.replace(/^.*?: /, ''))}</h3><p>${esc(e.d)}</p><span class="rule">${e.kind === 'bonus' ? `Верный ответ: вперёд на ${e.n}. Ошибка: просто шаг вперёд.` : `Верный ответ: след распознан, шаг вперёд. Ошибка: назад на ${e.n}.`}</span></div>`;
    if (S.spent[S.pos]) return panelHead() + fl + `<div class="event ${e.kind}"><span class="tl">Уже проверено</span><h3>${esc(e.t.replace(/^.*?: /, ''))}</h3><p>Эту карточку вы уже проходили. Идём дальше.</p></div><div class="act"><span></span><button class="btn" data-act="step">Шаг вперёд →</button></div>`;
    return panelHead() + fl + head + taskHtml(e.task, true);
  }
  if (!S.task || S.task.pos !== S.pos) pickTask(c.z, c.step);
  const goal = c.step === 1 && STAGES[c.z - 1].goal ? `<div class="goal" style="--pc:${PC(c.z)}"><span class="tl">Цель этапа «${esc(STAGES[c.z - 1].title)}»</span><p>${esc(STAGES[c.z - 1].goal)}</p></div>` : '';
  return panelHead() + fl + goal + taskHtml(curTask(), false);
}

function taskHtml(t, isEvent){
  if (!V) {
    if (t.type === 'choice') V = { order: shuffle(t.opts.map((_, j) => j)) };
    if (t.type === 'order') V = { pool: shuffle(t.items.map((_, j) => j)), ans: [] };
    if (t.type === 'sort') V = { pick: t.items.map(() => null), rows: shuffle(t.items.map((_, j) => j)) };
  }
  let inner = '';
  const testimony = t.client ? `<div class="testimony"><small>Из показаний клиента</small>«${esc(t.client)}»</div>` : '';
  if (t.type === 'choice') {
    inner = `<div class="opts">${V.order.map((j, n) => { const o = t.opts[j];
      let cls = ''; if (V.done) { if (o.ok) cls = 'right'; else if (V.sel === j) cls = 'wrong'; else cls = 'dim'; }
      const fb = V.done && (o.ok || V.sel === j) ? `<span class="fb">${esc(o.f)}</span>` : '';
      return `<button class="opt ${cls}" data-opt="${j}" ${V.done ? 'disabled' : ''}><span class="k">${V.done && o.ok ? '✓' : V.done && V.sel === j ? '✕' : 'АБВГ'[n]}</span><span>${esc(o.t)}${fb}</span></button>`; }).join('')}</div>`;
  }
  if (t.type === 'order') {
    inner = `<div class="pool">${V.pool.map(j => `<button class="tok" data-pool="${j}" ${V.done ? 'disabled' : ''}>${esc(t.items[j])}</button>`).join('')}</div>
      <div class="answer">${V.ans.map((j, n) => { const cls = V.done ? (j === n ? 'right' : 'wrong') : ''; return `<button class="tok ${cls}" data-ans="${n}" ${V.done ? 'disabled' : ''}><span>${esc(t.items[j])}</span>${V.done ? '' : '<span class="x">убрать</span>'}</button>`; }).join('')}</div>`;
    if (!V.done) inner += `<div class="act"><button class="link" data-act="oclear" ${V.ans.length ? '' : 'hidden'}>Сбросить</button><button class="btn dark" data-act="ocheck" ${V.pool.length ? 'disabled' : ''}>Проверить</button></div>`;
  }
  if (t.type === 'sort') {
    inner = `<div class="srt">${V.rows.map(j => { const [txt, b] = t.items[j]; const pk = V.pick[j];
      const cls = V.done ? (pk === b ? 'right' : 'wrong') : '';
      return `<div class="srow ${cls}"><div>${esc(txt)}${V.done && pk !== b ? `<span class="fix">Правильно: ${esc(t.buckets[b])}</span>` : ''}</div><div class="seg" role="group">${t.buckets.map((bn, bi) => `<button data-srow="${j}" data-b="${bi}" class="${pk === bi ? 'on' : ''}" ${V.done ? 'disabled' : ''} aria-pressed="${pk === bi}">${esc(bn)}</button>`).join('')}</div></div>`; }).join('')}</div>`;
    if (!V.done) inner += `<div class="act"><span></span><button class="btn dark" data-act="scheck" ${V.pick.some(p => p === null) ? 'disabled' : ''}>Проверить</button></div>`;
  }
  let after = '';
  if (V.done) {
    const ok = V.ok;
    let detail = '';
    if (t.type === 'order' && !ok) detail = `<div class="verdict-body">Правильный порядок:<ol class="correct-order">${t.items.map(s => `<li>${esc(s)}</li>`).join('')}</ol></div>`;
    if (t.type === 'sort' && !ok) detail = `<div class="verdict-body">Верно ${V.right} из ${t.items.length}. Нужно разложить всё без ошибок.</div>`;
    let btn, title;
    if (isEvent) {
      const e = EVENTS[CELLS[S.pos].z];
      if (e.kind === 'trap') { title = ok ? 'След распознан' : 'Вы пошли по ложному следу'; btn = ok ? `<button class="btn" data-act="ev-go" data-n="1">Обойти след →</button>` : `<button class="btn dark" data-act="ev-go" data-n="-${e.n}">Назад на ${e.n}</button>`; }
      else { title = ok ? 'Зацепка найдена' : 'Зацепка упущена'; btn = ok ? `<button class="btn" data-act="ev-go" data-n="${e.n}">Вперёд на ${e.n} →</button>` : `<button class="btn dark" data-act="ev-go" data-n="1">Шаг вперёд →</button>`; }
    } else if (S.done && S.sc) { title = ok ? 'Верно' : 'Неверно'; btn = `<button class="btn" data-act="sc-next">${S.sc.i + 1 < S.sc.list.length ? 'Следующий вопрос →' : 'Результат →'}</button>`; }
    else { title = ok ? 'Улика подтверждена' : 'Версия не сходится'; btn = ok ? `<button class="btn" data-act="step">Следующая карточка →</button>` : `<button class="btn dark" data-act="retry">Другое задание</button>`; }
    after = `<div class="verdict ${ok ? 'ok' : 'no'}">${title}<span>${ok ? '✓' : '✕'}</span></div>${detail}<div class="act"><span></span>${btn}</div>`;
  }
  return `<p class="q">${esc(t.q)}</p>` + testimony + inner + after;
}

function codeForm(kind, label, btn, hint){
  const err = formErr ? `<div class="formerr">${esc(formErr)}</div>` : ''; formErr = '';
  return `<form class="codeform" data-kind="${kind}"><label for="code">${esc(label)}</label><div class="row"><input id="code" autocomplete="off" spellcheck="false" placeholder="${esc(hint || 'Кодовое слово')}" maxlength="80"><button class="btn dark" type="submit">${esc(btn)}</button></div>${err}${TEST && kind !== 'fact' ? `<div class="testhint">Тестовый режим: код — ${esc(CONFIG.days[CELLS[S.pos].day].code)}</div>` : ''}</form>`;
}
function lockHtml(c, fl){
  return panelHead() + fl + `<div class="event lockcard"><span class="tl">Сейф с материалами</span><h3>Задание под замком</h3><p>В сейфе лежат материалы по главе «${esc(chapterOf(c.z))}». Чтобы открыть его, запросите у руководителя расследования кодовое слово.</p></div>` + codeForm('lock', 'Кодовое слово', 'Открыть сейф');
}
function gateHtml(c, fl){
  if (S.open[S.pos]) return panelHead() + fl + `<div class="event lockcard"><span class="tl">Печать снята</span><h3>${esc(CONFIG.days[c.day].title)}</h3><p>Расследование продолжается.</p></div><div class="act"><span></span><button class="btn" data-act="step">Дальше →</button></div>`;
  return panelHead() + fl + `<div class="event gatecard"><span class="tl">Конец дня ${c.day - 1}</span><h3>На сегодня всё, следователь</h3><p>Улики дня собраны. Дело продолжим на следующей встрече: ${esc(CONFIG.days[c.day].title)}. Код, чтобы снять печать, вы получите у руководителя расследования.</p></div>` + codeForm('gate', 'Код следующего дня', 'Снять печать');
}
function factHtml(c, fl){
  const f = CONFIG.facts[c.z];
  const card = `<div class="event factcard"><span class="tl">Архив компании</span><h3>Проверка осведомлённости</h3><p>Следователь должен знать, на кого работает. Ответьте на вопрос из архива «Белого маркера».</p></div><p class="q">${esc(f.q)}</p>`;
  if (S.open[S.pos]) return panelHead() + fl + card + `<div class="verdict ok">Факт подтверждён<span>✓</span></div>${S.open[S.pos] === 2 ? '<div class="verdict-body">Ответ пока не задан тренером, засчитано автоматически.</div>' : ''}<div class="act"><span></span><button class="btn" data-act="step">Следующая карточка →</button></div>`;
  return panelHead() + fl + card + codeForm('fact', 'Ваш ответ', 'Проверить', f.hint) + (TEST ? `<div class="testhint">Тестовый режим: ${f.a.length ? 'ответ — ' + esc(f.a.join(' / ')) : 'ответ не задан, подойдёт любой'}</div>` : '');
}
function finishHtml(){
  if (!S.done) { S.done = { all: S.tries ? Math.round(S.right / S.tries * 100) : 0, right: S.right, tries: S.tries, date: new Date().toISOString() }; save(); }
  return closedHtml();
}
function closedHtml(){
  if (S.sc) return scHtml();
  const d = new Date(S.done.date), best = bestPct(), rk = rankOf(best);
  const note = S.done.note ? `<div class="newrank">${esc(S.done.note)}</div>` : ''; if (S.done.note) { S.done.note = ''; save(); }
  setTimeout(drawCertPreview, 0);
  return `<div class="res">${note}
    <img class="cert" id="certimg" alt="Благодарность за раскрытие дела № 127">
    <div class="act" style="justify-content:center;width:100%;gap:10px;flex-wrap:wrap;margin-top:6px"><button class="btn" data-act="cert-dl">Скачать благодарность</button></div>
    <div class="rankline"><span class="tl" style="color:var(--ink-2)">Ваше звание</span><b>${esc(rk[1])}</b></div>
    <div class="ranks">${RANKS.slice().reverse().map(r => `<div class="${r === rk ? 'on' : ''}"><b>${esc(r[1])}</b>${esc(r[2])}</div>`).join('')}</div>
    <div class="kpis"><div><b>${S.done.all}%</b><span>верных за дело</span></div><div><b>${S.done.best != null ? S.done.best + '%' : '—'}</b><span>лучшая самопроверка</span></div><div><b>${d.toLocaleDateString('ru-RU')}</b><span>дата</span></div></div>
    <div class="selfcheck"><b>Повысить звание</b><span>Самопроверка: ${STAGES.length * SC_PER} случайных заданий из всех глав. Если результат выше, звание повысится и благодарность обновится. Звание никогда не понижается.</span></div>
    <div class="act" style="justify-content:center;width:100%;gap:10px;flex-wrap:wrap"><button class="btn dark" data-act="sc-start">Пройти самопроверку</button><button class="btn ghost" data-act="restart">Взять новое дело</button></div></div>`;

  x.font = `700 150px ${HEAD}`; x.fillText('БЛАГОДАРНОСТЬ', W / 2, 330);
  x.fillStyle = '#C3322A'; x.fillRect(W / 2 - 90, 362, 180, 5);
  x.fillStyle = '#25211B'; x.font = `400 36px ${BODY}`; x.fillText('за успешное раскрытие дела № 127', W / 2, 432);
  const style = (window.__nameStyle || NAME_STYLE);
  if (style === 'ink') {
    let fs = 128; const F = n => `700 ${n}px Caveat, "Segoe Script", cursive`; x.font = F(fs); while (x.measureText(name).width > W - 420 && fs > 60) { fs -= 4; x.font = F(fs); }
    x.strokeStyle = '#8C7F66'; x.lineWidth = 2; x.setLineDash([3, 9]); x.beginPath(); x.moveTo(330, 585); x.lineTo(W - 330, 585); x.stroke(); x.setLineDash([]);
    x.fillStyle = '#1D2B66'; x.save(); x.translate(W / 2, 568); x.rotate(-.015); x.fillText(name, 0, 0); x.restore();
  } else {
    let fs = 100; const F = n => `italic 700 ${n}px "PT Serif", Georgia, serif`; x.font = F(fs); while (x.measureText(name).width > W - 380 && fs > 50) { fs -= 4; x.font = F(fs); }
    x.fillStyle = '#8E1F18'; x.fillText(name, W / 2, 568);
  }
  x.fillStyle = '#4A443A'; x.font = `400 32px ${BODY}`; x.fillText('Все шесть улик собраны. Клиент выведен к законному решению.', W / 2, 640);
  // rank block
  const ry = 720; x.strokeStyle = '#D9CEB6'; x.lineWidth = 2; x.beginPath(); x.moveTo(300, ry); x.lineTo(W - 300, ry); x.stroke();
  x.fillStyle = '#6E6556'; x.font = `400 22px ${TYPE}`; spaced('ПРИСВОЕНО ЗВАНИЕ', W / 2, ry + 58, 4, 'center');
  x.fillStyle = '#C3322A'; x.font = `700 84px ${HEAD}`; x.fillText(rk[1].toUpperCase(), W / 2, ry + 150);
  x.fillStyle = '#4A443A'; x.font = `600 30px ${BODY}`;
  x.fillText(`Точность ${best}%   ·   ${new Date().toLocaleDateString('ru-RU')}`, W / 2, ry + 205);
  // signature
  const sy = H - 205, sim = await loadSign(); let tx = 150;
  if (sim) { const h = 200, w = sim.width / sim.height * h; x.drawImage(sim, 140, sy - 82, w, h); tx = 140 + w + 10; }
  x.textAlign = 'left'; x.strokeStyle = '#8C8272'; x.lineWidth = 2; x.lineCap = 'round'; x.beginPath(); x.moveTo(tx, sy + 52); x.lineTo(tx + 22, sy - 36); x.stroke();
  const nx = tx + 44;
  x.font = `600 34px ${BODY}`; x.fillText(SIGN.name, nx, sy - 2);
  x.fillStyle = '#6E6556'; x.font = `400 22px ${TYPE}`; spaced(SIGN.role.toUpperCase(), nx, sy + 38, 2, 'left');
  // stamp
  x.save(); x.translate(W - 330, H - 230); x.rotate(-.18); x.strokeStyle = 'rgba(195,50,42,.85)'; x.fillStyle = 'rgba(195,50,42,.85)';
  x.lineWidth = 7; x.beginPath(); x.arc(0, 0, 150, 0, Math.PI * 2); x.stroke(); x.lineWidth = 3; x.beginPath(); x.arc(0, 0, 112, 0, Math.PI * 2); x.stroke();
  const ring = '★ БЕЛЫЙ МАРКЕР ★ ОТДЕЛ РАССЛЕДОВАНИЙ '; x.font = `600 25px ${HEAD}`; x.textAlign = 'center';
  for (let i = 0; i < ring.length; i++) { x.save(); x.rotate(i / ring.length * Math.PI * 2); x.fillText(ring[i], 0, -122); x.restore(); }
  x.font = `700 40px ${HEAD}`; x.fillText('ДЕЛО', 0, -12); x.font = `700 34px ${HEAD}`; x.fillText('РАСКРЫТО', 0, 30); x.font = `600 24px ${HEAD}`; x.fillText('№ 127', 0, 72);

}
async function drawCertPreview(){ const img = document.getElementById('certimg'); if (!img) return; const cv = await drawCert(); img.src = cv.toDataURL('image/png'); }
async function downloadCert(){
  const cv = await drawCert(); const blob = await new Promise(r => cv.toBlob(r, 'image/png'));
  const fname = `Благодарность — ${(S.name || 'следователь').trim()}.png`;
  try { if (window.claude && window.claude.use) { const dl = await window.claude.use('downloads'); if (dl) { await dl.save({ filename: fname, data: blob }); return; } } } catch (e) { if (e && e.code === 'declined') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = fname; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
function scHtml(){
  const sc = S.sc, n = sc.list.length;
  const head = `<div class="ph"><div class="ch"><small>Самопроверка · может повысить звание</small><b><i></i>${sc.fin ? 'Результат' : `Вопрос ${sc.i + 1} из ${n}`}</b></div><div class="acc">${sc.fin || sc.i ? `${sc.right} верных` : ''}</div></div>`;
  if (sc.fin) { const pct = Math.round(sc.right / n * 100);
    if (!sc.applied) { sc.applied = true; const before = rankOf(bestPct()); const prev = S.done.best;
      if (prev == null || pct > prev) S.done.best = pct; const after = rankOf(bestPct());
      sc.msg = after !== before ? `Новое звание: ${after[1]}! Благодарность обновлена.` : (prev == null || pct > prev) && S.done.best > S.done.all ? 'Лучший результат обновлён.' : `Звание сохраняется: ${after[1]}.`; save(); }
    return head + `<div class="res"><div class="big ${pct >= 80 ? '' : 'no'}">${pct}%</div><h2>${pct >= 80 ? 'Отличная форма' : pct >= 60 ? 'Неплохо, но есть что повторить' : 'Стоит повторить материал'}</h2><p>Верно ${sc.right} из ${n}. Каждый раз набор заданий новый.</p><div class="newrank" style="margin-top:6px">${esc(sc.msg || '')}</div>
      <div class="act" style="justify-content:center;gap:10px;flex-wrap:wrap"><button class="btn" data-act="sc-start">Пройти ещё раз</button><button class="btn ghost" data-act="sc-exit">К благодарности</button></div></div>`; }
  const it = sc.list[sc.i];
  return head + `<p class="tl" style="color:var(--ink-2);margin:0 0 6px">Глава ${it.z} · ${esc(STAGES[it.z - 1].title)}</p>` + taskHtml(curTask(), false);
}

/* ---------- movement ---------- */
function moveTo(target){
  busy = true;
  const dir = target > S.pos ? 1 : -1, lens = document.getElementById('lens');
  const tick = () => {
    if (S.pos === target) { busy = false; showDossier = false; S.task = null; V = null; save(); render(); if (window.innerWidth < 940) { const p = document.getElementById('panel'); if (p) p.scrollIntoView({ behavior: 'smooth', block: 'start' }); } return; }
    S.pos += dir; const [x, y] = lensAt(S.pos); if (lens) { lens.style.left = x / COLS + '%'; lens.style.top = y / ROWS + '%'; }
    setTimeout(tick, 320);
  };
  tick();
}
function noteZoneChange(from, to){
  const a = CELLS[from].z, b = CELLS[to].z;
  if (a !== b && a >= 1 && a <= 6) flash = { stage: a, day: b === -1 };
}
function stepBy(n){
  const c = CELLS[S.pos]; let target = S.pos + n;
  if (c.type === 'ev') { const [a, b] = zoneRange(c.z); target = n > 0 ? Math.min(target, Math.max(b + (n === 1 ? 1 : 0), S.pos + 1)) : Math.max(target, a); }
  target = Math.max(0, Math.min(LAST, target));
  noteZoneChange(S.pos, target); moveTo(target);
}
function grade(ok, right){
  V.done = true; V.ok = ok; if (right != null) V.right = right;
  if (S.done && S.sc) { if (ok) S.sc.right++; }
  else { S.tries++; if (ok) S.right++; }
  save(); repaint();
}
function repaint(){ const p = document.getElementById('panel'); if (p) p.innerHTML = panelHtml(); }

/* ---------- events ---------- */
let titleClicks = 0, titleTimer = null;
document.addEventListener('submit', e => {
  const cf = e.target.closest('.codeform');
  if (cf) {
    e.preventDefault(); if (busy) return;
    const v = document.getElementById('code').value; if (!norm(v)) { document.getElementById('code').focus(); return; }
    const c = CELLS[S.pos], kind = cf.dataset.kind;
    if (kind === 'lock' || kind === 'gate') {
      const code = CONFIG.days[c.day].code;
      if (norm(v) === norm(code)) {
        S.open[S.pos] = 1; save();
        if (kind === 'gate') { flash = `Печать снята. ${CONFIG.days[c.day].title}: глава «${chapterOf(CELLS[S.pos + 1].z)}».`; stepBy(1); }
        else { flash = 'Сейф открыт.'; repaint(); }
      } else { formErr = 'Код не подходит. Уточните его у руководителя расследования.'; repaint(); }
      return;
    }
    if (kind === 'fact') {
      const f = CONFIG.facts[c.z]; const ans = norm(v);
      const ok = !f.a.length || f.a.some(x => { const n = norm(x); return n && (ans === n || ans.split(' ').includes(n) || n.split(' ').every(w => ans.includes(w))); });
      S.tries++; if (ok) { S.right++; S.open[S.pos] = f.a.length ? 1 : 2; } else formErr = 'Не совпадает. Уточните у руководителя расследования и попробуйте ещё раз.';
      save(); repaint(); return;
    }
  }
  if (e.target.id !== 'nameform') return; e.preventDefault();
  const inp = document.getElementById('nm'), v = inp.value.trim(); if (!v) { inp.focus(); return; }
  S.name = v; S.started = true; save(); render(); window.scrollTo(0, 0);
});
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act],[data-opt],[data-pool],[data-ans],[data-srow],[data-cell]');
  if (!el || el.disabled) return;
  const d = el.dataset;
  if (d.act === 'title') { titleClicks++; clearTimeout(titleTimer); titleTimer = setTimeout(() => titleClicks = 0, 1500); if (titleClicks >= 5) { titleClicks = 0; setTest(!TEST); render(); } return; }
  if (d.act === 'test-off') { setTest(false); render(); return; }
  if (d.cell !== undefined) { if (TEST && !busy) { S.done = null; S.sc = null; S.spent = {}; S.open = {}; S.pos = +d.cell; S.task = null; V = null; save(); render(); } return; }
  if (busy) return;
  if (d.act === 'go1') { stepBy(1); return; }
  if (d.act === 'step') { stepBy(1); return; }
  if (d.act === 'ev-go') { S.spent[S.pos] = 1; save(); stepBy(+d.n); return; }
  if (d.act === 'retry') { pickTask(CELLS[S.pos].z, CELLS[S.pos].step); repaint(); return; }
  if (d.act === 'sc-start') { startSelfCheck(); repaint(); return; }
  if (d.act === 'cert-dl') { downloadCert(); return; }
  if (d.act === 'board') { boardOpen = !boardOpen; render(); return; }
  if (d.act === 'dossier') { showDossier = !showDossier; render(); return; }
  if (d.act === 'sc-next') { S.sc.i++; if (S.sc.i >= S.sc.list.length) S.sc.fin = true; V = null; save(); repaint(); return; }
  if (d.act === 'sc-exit') { S.sc = null; V = null; save(); repaint(); return; }
  if (d.act === 'restart') { S = blank(S.name); S.started = true; V = null; save(); render(); window.scrollTo(0, 0); return; }
  const t = curTask(); if (!t || !V || V.done) return;
  if (d.opt !== undefined) { V.sel = +d.opt; grade(!!t.opts[+d.opt].ok); return; }
  if (d.pool !== undefined) { const j = +d.pool; V.pool = V.pool.filter(x => x !== j); V.ans.push(j); repaint(); return; }
  if (d.ans !== undefined) { const j = V.ans.splice(+d.ans, 1)[0]; V.pool.push(j); repaint(); return; }
  if (d.act === 'oclear') { V.pool = V.pool.concat(V.ans); V.ans = []; repaint(); return; }
  if (d.act === 'ocheck') { const right = V.ans.filter((j, p) => j === p).length; grade(right === t.items.length, right); return; }
  if (d.srow !== undefined) { V.pick[+d.srow] = +d.b; repaint(); return; }
  if (d.act === 'scheck') { const right = t.items.filter(([, b], j) => V.pick[j] === b).length; grade(right === t.items.length, right); return; }
});
window.addEventListener('hashchange', () => { if (location.hash === '#trener') { setTest(true); render(); } });

render();
})();
